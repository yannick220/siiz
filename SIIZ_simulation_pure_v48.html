:root {
  --yellow: #ffd400;
  --yellow-dark: #e2bb00;
  --yellow-soft: rgba(255, 212, 0, .16);
  --ink: #111113;
  --muted: rgba(17, 17, 19, .58);
  --line: rgba(17, 17, 19, .08);
  --surface: #ffffff;
  --canvas: #ffffff;
  --shadow: 0 28px 80px rgba(22, 22, 29, .12);
  --proximity-progress: 68.4%;
  --visual-viewport-bottom: 100dvh;
}

* { box-sizing: border-box; }

html, body { margin: 0; min-height: 100%; }

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  color: var(--ink);
  background:
    radial-gradient(circle at 13% 8%, rgba(255,212,0,.18), transparent 24rem),
    radial-gradient(circle at 90% 92%, rgba(255,212,0,.10), transparent 30rem),
    var(--canvas);
  font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea { font: inherit; }
button { color: inherit; }
button, [role="button"] { -webkit-tap-highlight-color: transparent; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.app-shell {
  position: relative;
  display: grid;
  grid-template-columns: 390px minmax(0, 1fr);
  width: min(1420px, calc(100vw - 44px));
  height: min(900px, calc(100vh - 44px));
  height: min(900px, calc(100dvh - 44px));
  margin: 22px auto;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 32px;
  box-shadow: var(--shadow);
}

.sidebar {
  position: relative;
  display: grid;
  grid-template-rows: auto auto auto minmax(0, 1fr);
  min-width: 0;
  overflow: hidden;
  background: #fff;
  border-right: 1px solid var(--line);
}

.sidebar-header, .chat-header {
  display: flex;
  align-items: center;
  height: 76px;
  padding: 0 22px;
}

.sidebar-header { justify-content: space-between; }

.brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  color: var(--ink);
  text-decoration: none;
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: -.04em;
}

.icon-button {
  display: inline-grid;
  width: 42px;
  height: 42px;
  flex: 0 0 auto;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  transition: background .2s ease, transform .2s ease, color .2s ease;
}

.icon-button:hover { background: rgba(17,17,19,.06); }
.icon-button:active { transform: scale(.94); }
.icon-button svg {
  width: 21px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.profile-access-button {
  overflow: hidden;
  color: var(--ink);
  background: var(--yellow);
}
.profile-access-button:hover { background: rgba(255,212,0,.82); }
.profile-access-visual {
  display: grid;
  width: 100%;
  height: 100%;
  overflow: hidden;
  place-items: center;
  border-radius: 50%;
}
.profile-access-visual img { width: 100%; height: 100%; object-fit: cover; }

.inbox-head {
  display: none;
  align-items: center;
  justify-content: stretch;
  padding: 8px 22px 14px;
}

.text-button {
  min-height: 38px;
  padding: 0 12px;
  color: var(--muted);
  border: 0;
  border-radius: 999px;
  background: rgba(17,17,19,.05);
  font-size: .78rem;
  font-weight: 600;
  cursor: pointer;
}

.text-button.active { color: var(--ink); background: var(--yellow-soft); }

.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  margin: 0 18px 10px;
  padding: 0 13px;
  color: rgba(17,17,19,.44);
  border-radius: 999px;
  background: rgba(17,17,19,.05);
}

.search-box svg { width: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.search-box input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; font-size: .9rem; }
.search-box input::placeholder { color: rgba(17,17,19,.44); }
.search-box button { display: none; border: 0; background: transparent; color: var(--muted); font-size: 1.3rem; cursor: pointer; }

.conversation-list { overflow-y: auto; padding: 2px 10px 172px; scrollbar-width: thin; }

.conversation {
  position: relative;
  display: grid;
  grid-template-columns: var(--conversation-avatar, 48px) minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  width: 100%;
  min-height: var(--conversation-height, 74px);
  padding: var(--conversation-padding, 10px) 11px;
  text-align: left;
  border: 0;
  border-radius: 999px;
  background: transparent;
  cursor: pointer;
  transition: min-height .28s ease, padding .28s ease, background .18s ease, transform .36s cubic-bezier(.22,.86,.25,1), opacity .28s ease;
}

.conversation:hover { background: rgba(17,17,19,.04); }
.conversation:active { transform: scale(.985); }
.conversation.active { background: var(--yellow-soft); }

.avatar {
  display: grid;
  width: 48px;
  height: 48px;
  flex: 0 0 auto;
  overflow: hidden;
  place-items: center;
  color: var(--yellow);
  border-radius: 50%;
  background: var(--ink);
  font-size: .78rem;
  font-weight: 700;
  letter-spacing: .03em;
}

.avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }

.conversation .avatar {
  width: var(--conversation-avatar, 48px);
  height: var(--conversation-avatar, 48px);
  transition: width .24s ease, height .24s ease, font-size .24s ease;
}

.avatar-main { width: 44px; height: 44px; }

.conversation-copy { min-width: 0; }
.conversation-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.conversation-title-row strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--conversation-title-size, .92rem); transition: font-size .24s ease; }
.conversation-time { flex: 0 0 auto; color: rgba(17,17,19,.4); font-size: .72rem; font-weight: 500; }
.conversation.active .conversation-time { color: rgba(17,17,19,.7); }
.conversation-preview { display: flex; align-items: center; gap: 7px; min-width: 0; margin-top: 6px; color: var(--muted); font-size: var(--conversation-preview-size, .76rem); transition: font-size .24s ease; }
.conversation-preview span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.distance-dots { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 2px; height: 12px; }
.distance-dots i { width: 3px; border-radius: 3px; background: rgba(17,17,19,.16); }
.distance-dots i:nth-child(1) { height: 4px; }
.distance-dots i:nth-child(2) { height: 7px; }
.distance-dots i:nth-child(3) { height: 10px; }
.distance-dots i:nth-child(4) { height: 12px; }
.distance-dots.band-1 i:nth-child(-n+1),
.distance-dots.band-2 i:nth-child(-n+2),
.distance-dots.band-3 i:nth-child(-n+3),
.distance-dots.band-4 i:nth-child(-n+4) { background: var(--yellow); }

.unread-dot {
  display: grid;
  min-width: 20px;
  height: 20px;
  place-items: center;
  padding: 0 5px;
  color: var(--ink);
  border-radius: 999px;
  background: var(--yellow);
  font-size: .62rem;
  font-weight: 700;
}

.chat-panel {
  position: relative;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  min-width: 0;
  background:
    linear-gradient(rgba(255,255,255,.90), rgba(255,255,255,.90)),
    radial-gradient(circle at 1px 1px, rgba(17,17,19,.14) 1px, transparent 0);
  background-size: auto, 24px 24px;
}

.chat-header {
  gap: 10px;
  background: rgba(255,255,255,.92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px);
}

.back-button { display: none; }
.contact-summary { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; }
.contact-copy { display: grid; gap: 4px; min-width: 0; }
.contact-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .96rem; }
.contact-copy small { color: rgba(17,17,19,.62); font-size: .7rem; font-weight: 600; }
.header-actions { display: flex; gap: 3px; margin-left: auto; }
.header-more { margin-left: auto; }
.header-more svg circle { fill: currentColor; stroke: none; }

.messages {
  display: flex;
  flex-direction: column;
  gap: 7px;
  overflow-y: auto;
  padding: 18px clamp(24px, 5.5vw, 80px) 102px;
  scroll-behavior: smooth;
  scrollbar-width: thin;
}

.date-chip {
  align-self: center;
  margin: 4px 0 12px;
  padding: 6px 10px;
  color: rgba(17,17,19,.5);
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.9);
  font-size: .72rem;
  font-weight: 600;
}

.message-row { display: flex; align-items: flex-end; max-width: 78%; }
.message-row.in { align-self: flex-start; }
.message-row.out { align-self: flex-end; }

.bubble {
  position: relative;
  padding: 11px 13px 8px;
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 6px 18px rgba(26,26,31,.07);
  line-height: 1.48;
  word-break: break-word;
  font-size: var(--message-size, 1rem);
  transition: font-size .16s ease;
}
.in .bubble { border-bottom-left-radius: 5px; }
.out .bubble { color: #fff; border-bottom-right-radius: 5px; background: var(--ink); }
.bubble-meta { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin: 5px -2px -1px 12px; color: rgba(17,17,19,.4); font-size: .7rem; font-weight: 500; line-height: 1; }
.out .bubble-meta { color: rgba(255,255,255,.62); }
.checks { color: var(--yellow); font-size: .68rem; letter-spacing: -.18em; }

.voice-message {
  display: grid;
  grid-template-columns: 34px minmax(82px, 150px) auto;
  align-items: center;
  gap: 8px;
  min-width: 170px;
  opacity: var(--voice-opacity);
}
.voice-play {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  padding: 0;
  color: var(--ink);
  border: 0;
  border-radius: 50%;
  background: var(--yellow);
  cursor: pointer;
}
.voice-play svg { width: 16px; fill: currentColor; stroke: none; }
.voice-play.playing { animation: voicePulse .8s ease-in-out infinite alternate; }
.voice-wave {
  display: flex;
  height: 28px;
  align-items: center;
  gap: 2px;
  transform: scaleY(var(--voice-scale));
  transform-origin: center;
  transition: transform .18s ease, opacity .18s ease;
}
.voice-wave i { width: 2px; height: var(--bar-height); border-radius: 2px; background: currentColor; }
.voice-duration { font-size: .62rem; font-weight: 600; opacity: .58; }
.out .voice-play { color: var(--ink); }

.message-author {
  display: block;
  margin-bottom: 4px;
  width: fit-content;
  padding: 3px 7px;
  color: var(--ink);
  border-radius: 999px;
  background: var(--yellow);
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .01em;
}

.out .message-author { display: none; }

.proximity-control {
  display: flex;
  height: 56px;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  pointer-events: none;
  user-select: none;
}

.home-proximity-control { display: none; }

.chat-proximity-control {
  z-index: 7;
  height: auto;
  padding: 0 20px 10px;
  background: rgba(255,255,255,.9);
}

.scale-drawer {
  position: relative;
  width: 100%;
  height: 50px;
  overflow: visible;
  padding: 0 14px;
  pointer-events: auto;
}

.floating-new-chat {
  position: absolute;
  z-index: 8;
  right: auto;
  bottom: 18px;
  left: 316px;
  display: grid;
  width: 56px;
  height: 56px;
  place-items: center;
  padding: 0;
  color: var(--ink);
  border: 0;
  border-radius: 50%;
  background: var(--yellow);
  box-shadow: 0 10px 24px rgba(17,17,19,.20);
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
}
.floating-action-icon {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  opacity: 1;
  transform: translateY(0);
  transition: transform .34s cubic-bezier(.22,.8,.24,1), opacity .22s ease;
}

const escapeHtml = (value) => value.replace(/[&<>'"]/g, char => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#039;", '"': "&quot;"
}[char]));

function profileForName(name) {
  const contact = conversations.find(item => item.name === name);
  if (contact) return contact;
  const phoneContact = phoneContacts.find(item => item.name === name);
  if (phoneContact) return phoneContact;
  if (participantProfiles[name]) return participantProfiles[name];
  return {
    name,
    initials: name.split(/\s+/).map(word => word[0]).slice(0, 2).join("").toLocaleUpperCase("fr")
  };
}

function avatarMarkup(profile, className = "") {
  const classes = `avatar${className ? ` ${className}` : ""}`;
  const content = profile.avatar
    ? `<img src="${escapeHtml(profile.avatar)}" alt="" />`
    : escapeHtml(profile.initials || "");
  return `<span class="${classes}">${content}</span>`;
}

function contactHasConversation(contact) {
  return conversations.some(item => !item.isGroup && item.name === contact.name);
}

function conversationContactItems() {
  return conversations
    .filter(item => !item.isGroup && !item.offScale)
    .map(item => ({ ...item, key: `conversation:${item.id}`, conversationId: item.id, source: "conversation" }));
}

function phoneContactItems() {
  return phoneContacts
    .filter(item => item.status === "available" && !contactHasConversation(item))
    .map(item => ({ ...item, key: `phone:${item.id}`, source: "phone" }));
}

function availableSiizContacts() {
  return [...conversationContactItems(), ...phoneContactItems()];
}

function inviteContactItems() {
  return phoneContacts.filter(item => item.status === "invite");
}

function unavailableSiizContacts() {
  return conversations
    .filter(item => !item.isGroup && item.offScale)
    .map(item => ({ ...item, key: `unavailable:${item.id}`, source: "off-gps" }));
}

function bandForDistance(distanceKm) {
  if (distanceKm < .5) return 4;
  if (distanceKm < 12) return 3;
  if (distanceKm < 250) return 2;
  return 1;
}

function ensureContactConversation(contactId) {
  const contact = phoneContacts.find(item => item.id === contactId);
  if (!contact || contact.status !== "available") return "";
  const existing = conversations.find(item => !item.isGroup && item.name === contact.name);
  if (existing) return existing.id;
  const time = now();
  const id = `contact-${contact.id}`;
  conversations.unshift({
    id,
    name: contact.name,
    initials: contact.initials,
    avatar: contact.avatar,
    proximity: contact.proximity,
    band: bandForDistance(contact.distanceKm),
    distanceKm: contact.distanceKm,
    preview: "Je suis aussi sur SIIZ.",
    time,
    unread: 0,
    activitySort: Date.now(),
    messages: [
      { side: "in", text: "Je suis aussi sur SIIZ.", time, band: bandForDistance(contact.distanceKm) }
    ]
  });
  return id;
}

function resolveGroupCandidate(key) {
  const [source, id] = key.split(":");
  if (source === "conversation") return conversations.find(item => item.id === id);
  if (source === "phone") return phoneContacts.find(item => item.id === id);
  return null;
}

function setAvatarElement(element, profile) {
  element.replaceChildren();
  if (profile.avatar) {
    const image = document.createElement("img");
    image.src = profile.avatar;
    image.alt = "";
    element.append(image);
    return;
  }
  element.textContent = profile.initials || "";
}

function renderProfileButton() {
  const savedPhoto = localStorage.getItem("siiz-profile-photo");
  if (!savedPhoto) return;
  const image = document.createElement("img");
  image.src = savedPhoto;
  image.alt = "";
  profileButtonVisual.replaceChildren(image);
}

function normalizeScalePosition(value) {
  const numericValue = Number(value);
  if (!Number.isFinite(numericValue)) return SCALE_DEFAULT_POSITION;
  return Math.max(0, Math.min(SCALE_SLIDER_MAX, Math.round(numericValue)));
}

function scalePositionForDistance(distanceKm) {
  if (!Number.isFinite(distanceKm)) return SCALE_SLIDER_MAX;
  const clampedDistance = Math.max(SCALE_MIN_KM, Math.min(SCALE_MAX_KM, Number(distanceKm) || SCALE_MIN_KM));
  const logarithmicProgress = Math.log(clampedDistance / SCALE_MIN_KM) / Math.log(SCALE_MAX_KM / SCALE_MIN_KM);
  return Math.round(logarithmicProgress * SCALE_FINITE_MAX);
}

function initialScalePosition() {
  const savedLevel = localStorage.getItem("siiz-scale-level");
  const savedVersion = localStorage.getItem("siiz-scale-version");
  if (savedLevel !== null) {
    if (savedVersion === SCALE_STORAGE_VERSION) return normalizeScalePosition(savedLevel);
    if (savedVersion === "continuous-v2") {
      const previousPosition = normalizeScalePosition(savedLevel);
      if (previousPosition >= SCALE_SLIDER_MAX) return SCALE_SLIDER_MAX;
      const previousDistanceKm = SCALE_MIN_KM * Math.pow(SCALE_MAX_KM / SCALE_MIN_KM, previousPosition / SCALE_LEGACY_FINITE_MAX);
      return scalePositionForDistance(previousDistanceKm);
    }
    if (savedVersion === "continuous-v1") {
      const previousPosition = normalizeScalePosition(savedLevel);
      if (previousPosition >= SCALE_SLIDER_MAX) return SCALE_SLIDER_MAX;
      const previousDistanceKm = .01 * Math.pow(SCALE_MAX_KM / .01, previousPosition / SCALE_LEGACY_FINITE_MAX);
      return scalePositionForDistance(previousDistanceKm);
    }
    let legacyDistances;
    if (savedVersion === "distance-v5") {
      legacyDistances = [.01, .1, 1, 10, 100, 1000, Infinity];
    } else if (savedVersion === "distance-v4" || savedVersion === "distance-v3") {
      legacyDistances = [.01, .1, 1, 10, 100, 1000, SCALE_MAX_KM, Infinity];
    } else if (savedVersion === "distance-v2") {
      legacyDistances = [.1, 1, 10, 100, 1000, SCALE_MAX_KM, Infinity];
    } else {
      legacyDistances = [.1, 10, 150, 1000, SCALE_MAX_KM, Infinity];
    }
    const previousLevel = Math.max(0, Math.min(legacyDistances.length - 1, Math.round(Number(savedLevel) || 0)));
    return scalePositionForDistance(legacyDistances[previousLevel]);
  }

  const legacyValue = Number(localStorage.getItem("siiz-scale") ?? localStorage.getItem("walo-scale"));
  if (!Number.isFinite(legacyValue)) return SCALE_DEFAULT_POSITION;
  if (legacyValue < 20) return scalePositionForDistance(.1);
  if (legacyValue < 40) return scalePositionForDistance(10);
  if (legacyValue < 60) return scalePositionForDistance(100);
  if (legacyValue < 80) return scalePositionForDistance(1000);
  return SCALE_SLIDER_MAX;
}

function scaleDistance(value) {
  const position = normalizeScalePosition(value);
  const logarithmicProgress = position / SCALE_FINITE_MAX;
  return SCALE_MIN_KM * Math.pow(SCALE_MAX_KM / SCALE_MIN_KM, logarithmicProgress);
}

function isGlobalScale() {
  return normalizeScalePosition(comparisonScale) >= SCALE_SLIDER_MAX;
}

function scaleAccessibilityText(value) {
  if (!proximityEnabled) return "En pause";
  const progress = normalizeScalePosition(value) / SCALE_SLIDER_MAX;
  if (progress < .25) return "Différences de taille très marquées";
  if (progress < .5) return "Différences de taille marquées";
  if (progress < .75) return "Différences de taille modérées";
  if (progress < .95) return "Différences de taille faibles";
  return "Tailles presque uniformes";
}

function proximityFactorForDistance(distanceKm) {
  if (!proximityEnabled) return 1;
  if (isGlobalScale()) return 1;
  const observedScaleKm = scaleDistance(comparisonScale);
  if (!Number.isFinite(observedScaleKm)) return 1;

  const absoluteDistanceKm = Math.max(0, Number(distanceKm) || 0);
  const relativeDistance = absoluteDistanceKm / observedScaleKm;
  return Math.max(0, 1 - Math.log10(1 + relativeDistance) / 4);
}

function textSizeForDistance(distanceKm) {
  if (!proximityEnabled) return 16;
  const proximityFactor = proximityFactorForDistance(distanceKm);
  return MESSAGE_SIZE_MIN + (MESSAGE_SIZE_MAX - MESSAGE_SIZE_MIN) * proximityFactor;
}

function audioGainForDistance(distanceKm) {
  if (!proximityEnabled) return 1;
  return .45 + .55 * proximityFactorForDistance(distanceKm);
}

function conversationSizing(item) {
  const displayedMessageDistance = item.isGroup && Number.isFinite(item.previewDistanceKm)
    ? item.previewDistanceKm
    : item.distanceKm;
  const readingSize = textSizeForDistance(displayedMessageDistance);
  const weight = (readingSize - MESSAGE_SIZE_MIN) / (MESSAGE_SIZE_MAX - MESSAGE_SIZE_MIN);
  const avatar = Math.round(24 + weight * 34);
  const height = Math.round(34 + weight * 54);
  const padding = Math.round(2 + weight * 7);
  const title = Math.max(4, Math.min(18, readingSize)).toFixed(1);
  const preview = Math.max(3.5, Math.min(15, readingSize - 2)).toFixed(1);
  return `--conversation-avatar:${avatar}px;--conversation-height:${height}px;--conversation-padding:${padding}px;--conversation-title-size:${title}px;--conversation-preview-size:${preview}px;opacity:${(.18 + weight * .82).toFixed(2)}`;
}

function voiceMessageMarkup(message, distanceKm, isOutgoing) {
  const gain = isOutgoing ? 1 : audioGainForDistance(distanceKm);
  const proximityFactor = isOutgoing ? 1 : proximityFactorForDistance(distanceKm);
  const visualOpacity = .35 + proximityFactor * .65;
  const waveformScale = .22 + proximityFactor * .78;
  const bars = [9, 16, 12, 22, 15, 25, 12, 19, 10, 24, 16, 21, 9, 17, 12, 7]
    .map(height => `<i style="--bar-height:${height}px"></i>`).join("");
  return `
    <span class="voice-message" style="--voice-opacity:${visualOpacity.toFixed(3)};--voice-scale:${waveformScale.toFixed(3)}">
      <button class="voice-play" type="button" data-voice-distance="${distanceKm}" data-voice-outgoing="${isOutgoing ? "true" : "false"}" data-transcript="${escapeHtml(message.transcript || "Message vocal")}" aria-label="Écouter le message vocal">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
      </button>
      <span class="voice-wave" aria-hidden="true">${bars}</span>
      <span class="voice-duration">${escapeHtml(message.duration || "0:05")}</span>
    </span>`;
}

function renderConversations() {
  const query = searchInput.value.trim().toLocaleLowerCase("fr");
  const filtered = conversations
    .filter(item => {
      if (item.offScale) return false;
      return `${item.name} ${item.preview}`.toLocaleLowerCase("fr").includes(query);
    })
    .sort((a, b) => (b.activitySort || 0) - (a.activitySort || 0));

  listEl.innerHTML = filtered.length ? filtered.map(item => `
    <button class="conversation ${item.id === activeId ? "active" : ""}" style="${conversationSizing(item)}" data-id="${item.id}" type="button" aria-label="Ouvrir la discussion avec ${escapeHtml(item.name)}">
      ${avatarMarkup(item)}
      <span class="conversation-copy">
        <span class="conversation-title-row">
          <strong>${escapeHtml(item.name)}</strong>
          <span class="conversation-time">${item.time}</span>
        </span>
        <span class="conversation-preview">
          <span>${escapeHtml(item.preview)}</span>
        </span>
      </span>
      ${item.unread ? `<span class="unread-dot">${item.unread}</span>` : ""}
    </button>
  `).join("") : `<div class="empty-list">Aucune discussion ne correspond à cette recherche.</div>`;
}

function renderActiveConversation() {
  const active = conversations.find(item => item.id === activeId);
  if (!active) return;
  chatName.textContent = active.name;
  chatStatus.textContent = active.offScale ? "hors GPS" : (proximityEnabled ? active.proximity : "proximité en pause");
  setAvatarElement(chatAvatar, active);
  messagesEl.innerHTML = `<div class="date-chip">AUJOURD'HUI</div>` + active.messages.map(message => {
    const messageDistance = active.isGroup ? message.distanceKm : active.distanceKm;
    const resolvedDistance = Number.isFinite(messageDistance) ? messageDistance : active.distanceKm;
    const messageSize = active.offScale
      ? 16
      : message.side === "out"
      ? (proximityEnabled ? MESSAGE_SIZE_MAX : 16)
      : textSizeForDistance(resolvedDistance);
    const content = message.type === "audio"
      ? voiceMessageMarkup(message, resolvedDistance, message.side === "out")
      : escapeHtml(message.text);
    return `
    <div class="message-row ${message.side}">
      <div class="bubble" style="--message-size:${messageSize.toFixed(2)}px">
        ${active.isGroup && message.sender ? `<span class="message-author">${escapeHtml(message.sender)}</span>` : ""}
        ${content}
        <span class="bubble-meta">${message.time}${message.side === "out" ? '<span class="checks">✓✓</span>' : ""}</span>
      </div>
    </div>
  `}).join("");
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

function updateComparisonScale(rawValue) {
  const value = normalizeScalePosition(rawValue);
  const accessibilityLabel = scaleAccessibilityText(value);
  comparisonScale = value;
  localStorage.setItem("siiz-scale-level", String(value));
  localStorage.setItem("siiz-scale-version", SCALE_STORAGE_VERSION);
  document.documentElement.style.setProperty("--proximity-progress", `${value / SCALE_SLIDER_MAX * 100}%`);
  scaleControls.forEach(control => {
    control.range.value = value;
    control.range.setAttribute("aria-valuetext", accessibilityLabel.toLocaleLowerCase("fr"));
  });
  renderConversations();
  renderActiveConversation();
}

function setProximityEnabled(enabled) {
  proximityEnabled = Boolean(enabled);
  localStorage.setItem("siiz-proximity", proximityEnabled ? "on" : "off");
  homeScaleRange.disabled = !proximityEnabled;
  chatScaleRange.disabled = !proximityEnabled;
  document.body.classList.toggle("proximity-paused", !proximityEnabled);
  updateComparisonScale(comparisonScale);
}

function openConversation(id) {
  const conversation = conversations.find(item => item.id === id);
  if (!conversation) return;
  searchInput.blur();
  activeId = id;
  conversation.unread = 0;
  renderConversations();
  renderActiveConversation();
  appShell.classList.add("chat-open");
  syncFloatingAction();
}

function mobileConversationIsOpen() {
  const compactLayout = window.matchMedia("(max-width: 820px), (max-height: 600px) and (hover: none) and (pointer: coarse)").matches;
  return compactLayout && appShell.classList.contains("chat-open");
}

function syncFloatingAction() {
  const sendMode = mobileConversationIsOpen();
  const canSend = Boolean(messageInput.value.trim());
  floatingNewChat.classList.toggle("can-send", !sendMode || canSend);
  floatingNewChat.setAttribute("aria-label", sendMode ? "Envoyer le message" : "Lancer une nouvelle conversation");
  floatingNewChat.title = sendMode ? "Envoyer le message" : "Nouvelle conversation";
}

function syncVisualViewport() {
  const viewport = window.visualViewport;
  const viewportBottom = viewport
    ? viewport.offsetTop + viewport.height
    : window.innerHeight;
  document.documentElement.style.setProperty("--visual-viewport-bottom", `${Math.round(viewportBottom)}px`);
}

function closeConversation() {
  messageInput.blur();
  appShell.classList.remove("chat-open");
  syncFloatingAction();
  syncVisualViewport();
}

function now() {
  return new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit" }).format(new Date());
}

function moveConversationToTop(conversation) {
  const index = conversations.indexOf(conversation);
  if (index <= 0) return;
  conversations.splice(index, 1);
  conversations.unshift(conversation);
}

function sendMessage(text) {
  const value = text.trim();
  if (!value) return;
  const active = conversations.find(item => item.id === activeId);
  const time = now();
  active.messages.push({ side: "out", text: value, time, band: active.band });
  active.preview = value;
  active.time = time;
  active.activitySort = Date.now();
  moveConversationToTop(active);
  messageInput.value = "";
  resizeInput();
  renderConversations();
  renderActiveConversation();
}

function sendVoiceMessage() {
  const active = conversations.find(item => item.id === activeId);
  const time = now();
  active.messages.push({
    side: "out",
    type: "audio",
    transcript: "Voici mon message vocal.",
    duration: "0:04",
    time
  });
  active.preview = "Message vocal";
  active.time = time;
  active.activitySort = Date.now();
  moveConversationToTop(active);
  renderConversations();
  renderActiveConversation();
}

function playVoiceMessage(button) {
  if (!("speechSynthesis" in window)) {
    showToast("Lecture vocale indisponible sur ce navigateur");
    return;
  }
  window.speechSynthesis.cancel();
  document.querySelectorAll(".voice-play.playing").forEach(item => item.classList.remove("playing"));
  const isOutgoing = button.dataset.voiceOutgoing === "true";
  const gain = isOutgoing ? 1 : audioGainForDistance(Number(button.dataset.voiceDistance));
  const utterance = new SpeechSynthesisUtterance(button.dataset.transcript || "Message vocal");
  utterance.lang = "fr-FR";
  utterance.rate = .96;
  utterance.volume = Math.max(.01, Math.min(1, gain));
  button.classList.add("playing");
  utterance.onend = utterance.onerror = () => button.classList.remove("playing");
  window.speechSynthesis.speak(utterance);
}

function resizeInput() {
  messageInput.style.height = "auto";
  messageInput.style.height = `${Math.min(messageInput.scrollHeight, 120)}px`;

}

function showToast(message) {
  clearTimeout(toastTimer);
  const toast = document.querySelector("#toast");
  toast.textContent = message;
  toast.classList.add("show");
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
}

function closeDialog() {
  if (dialogBackdrop.hidden || dialogBackdrop.classList.contains("is-closing")) return;
  clearTimeout(dialogCloseTimer);
  dialogBackdrop.classList.remove("is-open");
  dialogBackdrop.classList.add("is-closing");
  const finishClosing = () => {
    dialogBackdrop.hidden = true;
    dialogBackdrop.classList.remove("is-closing");
    dialog.innerHTML = "";
    dialogTrigger?.focus?.();
    dialogTrigger = null;
  };
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    finishClosing();
  } else {
    dialogCloseTimer = setTimeout(finishClosing, 460);
  }
}

function openDialog(content, direction = "forward") {
  const alreadyOpen = !dialogBackdrop.hidden && dialogBackdrop.classList.contains("is-open");
  clearTimeout(dialogCloseTimer);
  if (!alreadyOpen) dialogTrigger = document.activeElement;
  dialog.classList.remove("content-forward", "content-back");
  dialog.innerHTML = content;
  dialogBackdrop.hidden = false;
  dialogBackdrop.classList.remove("is-closing");
  if (!alreadyOpen) {
    dialogBackdrop.classList.remove("is-open");
    requestAnimationFrame(() => requestAnimationFrame(() => dialogBackdrop.classList.add("is-open")));
  } else {
    void dialog.offsetWidth;
    dialog.classList.add(direction === "back" ? "content-back" : "content-forward");
  }
  dialog.querySelector("button")?.focus();
}

    },
    terms: {
      title: "Conditions d’utilisation",

    },

function exportDemoData() {
  const data = {
    exportedAt: new Date().toISOString(),
    profile: { name: "Yannick" },
    settings: { proximityEnabled, comparisonScale },
    contacts: phoneContacts.map(item => ({ name: item.name, status: item.status, phone: item.phone || null })),
    conversations: conversations.map(item => ({ name: item.name, isGroup: Boolean(item.isGroup), messages: item.messages }))
  };
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "siiz-mes-donnees.json";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast("Données de démonstration téléchargées");
}

function persistSet(key, values) {
  localStorage.setItem(key, JSON.stringify([...values]));
}

function handleDialogAction(action) {
  const active = conversations.find(item => item.id === activeId);
  if (action === "profile") showProfile("back");
  if (action === "contacts") showContactsHub();
  if (action === "contacts-permission") showContactsPermission();
  if (action === "invite-link") showInviteContact();
  if (action === "privacy") showPrivacySettings();
  if (action === "account-data") showAccountData();
  if (action === "account-data-back") showAccountData("back");
  if (action === "security") showSecurity();
  if (action === "help") showHelp();
  if (action === "legal") showLegalHub();
  if (action === "privacy-document") showLegalDocument("privacy");
  if (action === "terms-document") showLegalDocument("terms");
  if (action === "legal-notice") showLegalDocument("notice");
  if (action === "contact-info") showContactInfo("back");
  if (action === "group-participants") showGroupParticipants();
  if (action === "group-add") showGroupAdd();
  if (action === "report") showReport();
  if (action === "delete-account") showDeleteAccount();
  if (action === "blocked-list") showBlockedContacts();
  if (action === "security-note") showSecurityNote();
  if (action === "export-data") exportDemoData();
  if (action === "clear-proximity") showToast("Dernière zone de proximité effacée");
  if (action === "sync-contacts") {
    showContactsHub("back");
    showToast("Carnet d’adresses synchronisé");
  }
  if (action === "copy-invite-link") showToast("Invitation copiée");
  if (action === "group-mute" && active) {
    mutedGroups.has(active.id) ? mutedGroups.delete(active.id) : mutedGroups.add(active.id);
    persistSet("siiz-muted-groups", mutedGroups);
    showContactInfo("back");
    showToast(mutedGroups.has(active.id) ? "Notifications du groupe suspendues" : "Notifications du groupe réactivées");
  }
  if (action === "block-contact" && active) {
    blockedContacts.has(active.id) ? blockedContacts.delete(active.id) : blockedContacts.add(active.id);
    persistSet("siiz-blocked-contacts", blockedContacts);
    showContactInfo("back");
    showToast(blockedContacts.has(active.id) ? `${active.name} est bloqué` : `${active.name} est débloqué`);
  }
  if (action === "leave-group") showLeaveGroup();
  if (action === "confirm-leave" && active?.isGroup) {
    const index = conversations.findIndex(item => item.id === active.id);
    conversations.splice(index, 1);
    activeId = conversations[0]?.id || "";
    closeDialog();
    appShell.classList.remove("chat-open");
    renderConversations();
    renderActiveConversation();
    showToast("Vous avez quitté le groupe");
  }
  if (action === "confirm-delete") {
    ["siiz-proximity", "siiz-scale", "siiz-scale-level", "siiz-scale-version", "siiz-profile-photo", "siiz-muted-groups", "siiz-blocked-contacts", "walo-proximity", "walo-scale", "walo-muted-groups", "walo-blocked-contacts"].forEach(key => localStorage.removeItem(key));
    comparisonScale = SCALE_DEFAULT_POSITION;
    mutedGroups = new Set();
    blockedContacts = new Set();
    setProximityEnabled(true);
    closeDialog();
    showToast("Compte de démonstration réinitialisé");
  }
}

dialogBackdrop.addEventListener("click", event => {
  if (event.target === dialogBackdrop || event.target.closest(".close-dialog")) closeDialog();
  if (event.target.closest("[data-new-group]")) showGroupCreator();
  const action = event.target.closest("[data-dialog-action]")?.dataset.dialogAction;
  if (action) handleDialogAction(action);
  const opener = event.target.closest("[data-open]");
  if (opener) {
    closeDialog();
    openConversation(opener.dataset.open);
  }
  const contactStarter = event.target.closest("[data-start-contact]");
  if (contactStarter) {
    const id = ensureContactConversation(contactStarter.dataset.startContact);
    if (id) {
      closeDialog();
      openConversation(id);
      showToast("Discussion ouverte depuis vos contacts");
    }
  }
  const contactInvite = event.target.closest("[data-invite-contact]");
  if (contactInvite) showInviteContact(contactInvite.dataset.inviteContact);
  const unblocker = event.target.closest("[data-unblock]");
  if (unblocker) {
    blockedContacts.delete(unblocker.dataset.unblock);
    persistSet("siiz-blocked-contacts", blockedContacts);
    showBlockedContacts("back");
    showToast("Contact débloqué");
  }
});

dialogBackdrop.addEventListener("change", event => {
  if (event.target.id !== "proximityToggle") return;
  setProximityEnabled(event.target.checked);
  showToast(event.target.checked ? "Proximité activée" : "Proximité mise en pause");
});

dialogBackdrop.addEventListener("submit", event => {
  if (event.target.id === "helpForm") {
    event.preventDefault();
    closeDialog();
    showToast("Parcours d’aide testé · aucun envoi réel");
    return;
  }
  if (event.target.id === "reportForm") {
    event.preventDefault();
    closeDialog();
    showToast("Parcours de signalement testé · aucun envoi réel");
    return;
  }
  if (event.target.id === "addMembersForm") {
    event.preventDefault();
    const active = conversations.find(item => item.id === activeId);
    const data = new FormData(event.target);
    const selected = data.getAll("members").map(resolveGroupCandidate).filter(Boolean);
    if (!selected.length) {
      showToast("Choisissez au moins un participant");
      return;
    }
    active.members = [...(active.members || []), ...selected.map(item => item.name)];
    active.proximity = `${active.members.length} participants · plusieurs distances`;
    renderActiveConversation();
    showContactInfo("back");
    showToast(`${selected.length} participant${selected.length > 1 ? "s ajoutés" : " ajouté"}`);
    return;
  }
  if (event.target.id !== "groupForm") return;
  event.preventDefault();
  const data = new FormData(event.target);
  const name = String(data.get("groupName") || "").trim();
  const memberIds = data.getAll("members");
  if (!name || memberIds.length < 2) {
    showToast("Choisissez un nom et au moins deux participants");
    return;
  }
  const members = memberIds.map(resolveGroupCandidate).filter(Boolean);
  const groupDistance = Math.exp(members.reduce((sum, member) => sum + Math.log(Math.max(.01, member.distanceKm)), 0) / members.length);
  const initials = name.split(/\s+/).slice(0, 2).map(word => word[0]).join("").toLocaleUpperCase("fr");
  const time = now();
  const id = `group-${Date.now()}`;
  conversations.unshift({
    id,
    name,
    initials,
    proximity: `${members.length + 1} participants · plusieurs distances`,
    band: 2,
    distanceKm: groupDistance,
    isGroup: true,
    members: ["Yannick", ...members.map(member => member.name)],
    preview: `${members[0].name} : groupe créé`,
    previewDistanceKm: members[0].distanceKm,
    time,
    activitySort: Date.now(),
    unread: 0,
    messages: members.slice(0, 2).map((member, index) => ({
      side: "in",
      sender: member.name,
      distanceKm: member.distanceKm,
      text: index === 0 ? "Parfait, on se retrouve ici." : "Bien reçu !",
      time
    }))
  });
  closeDialog();
  openConversation(id);
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    if (!dialogBackdrop.hidden) closeDialog();
    else closeConversation();
  }
});

window.addEventListener("resize", () => {
  syncFloatingAction();
  syncVisualViewport();
});

syncVisualViewport();
renderConversations();
renderActiveConversation();
renderProfileButton();
setProximityEnabled(proximityEnabled);
